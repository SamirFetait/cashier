<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HQ Login</title>
  <style>
    body { margin:0; font-family:system-ui,sans-serif; background:#f4f6fb; display:flex; min-height:100vh; align-items:center; justify-content:center; }
    .box { background:#fff; padding:32px; border-radius:12px; border:1px solid #e5e7eb; width:320px; }
    h1 { font-size:20px; margin:0 0 16px; }
    label { display:block; font-size:13px; color:#6b7280; margin-top:12px; }
    input { width:100%; padding:8px; margin-top:4px; border:1px solid #d1d5db; border-radius:8px; }
    button { margin-top:16px; width:100%; padding:10px; background:#4c6ef5; color:#fff; border:0; border-radius:8px; cursor:pointer; }
    .err { color:#b91c1c; font-size:13px; margin-top:12px; }
  </style>
</head>
<body>
  <form class="box" method="post">
    {% csrf_token %}
    <h1>HQ — Branch Reporting</h1>
    {% if form.errors %}<div class="err">Invalid username or password.</div>{% endif %}
    <label>Username</label>
    <input type="text" name="username" autofocus required />
    <label>Password</label>
    <input type="password" name="password" required />
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
