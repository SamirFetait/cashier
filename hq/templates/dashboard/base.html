{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}HQ Reporting{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <style>
    :root { --bg:#f4f6fb; --card:#fff; --ink:#1f2933; --muted:#6b7280; --accent:#4c6ef5; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--ink); }
    header { background:#1f2933; color:#fff; padding:12px 24px; display:flex; justify-content:space-between; align-items:center; }
    header a { color:#cbd5e1; text-decoration:none; }
    .wrap { max-width:1100px; margin:24px auto; padding:0 16px; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:24px; }
    .card { background:var(--card); border:1px solid #e5e7eb; border-radius:10px; padding:16px; }
    .kpi-label { font-size:12px; color:var(--muted); text-transform:uppercase; font-weight:700; }
    .kpi-value { font-size:26px; font-weight:700; margin-top:4px; }
    table { width:100%; border-collapse:collapse; background:var(--card); border-radius:10px; overflow:hidden; }
    th, td { text-align:left; padding:10px 12px; border-bottom:1px solid #eef0f3; font-size:14px; }
    th { background:#f8fafc; color:var(--muted); }
    .badge { padding:2px 8px; border-radius:10px; font-size:12px; font-weight:600; }
    .ok { background:#dcfce7; color:#166534; }
    .stale { background:#fee2e2; color:#991b1b; }
    h1,h2 { margin: 0 0 12px; }
    a.btn { background:var(--accent); color:#fff; padding:6px 12px; border-radius:8px; text-decoration:none; font-size:13px; }
  </style>
</head>
<body>
  <header>
    <strong>HQ — Branch Reporting</strong>
    <div>
      {% if user.is_authenticated %}{{ user.username }} · <a href="{% url 'logout' %}">Logout</a>{% endif %}
    </div>
  </header>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
